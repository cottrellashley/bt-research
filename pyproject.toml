[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-fi"
version = "0.3.0"
description = "Fixed income backtesting platform on Nautilus Trader v2: point-in-time data, marks vs fills, dated settlement, ledger of record, funding, structured deals, manifests"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
    "nautilus_trader>=2.0.0rc8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "tabulate>=0.9",
    "scipy>=1.11",
    "highspy>=1.7",
]

[project.optional-dependencies]
quantlib = ["QuantLib>=1.33"]
snowflake = ["snowflake-connector-python>=3.6", "cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["nautilus_fi*"]

[tool.setuptools.package-data]
"nautilus_fi.data.loaders" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
